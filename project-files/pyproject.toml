[project]
name = "calt-experiments"
version = "0.1.0"
description = "Experiments for learning algebraic computations with Transformers"
requires-python = ">=3.10,<3.13"
dependencies = [
    # calt-x (PyPI). Provides calt.io.preprocess, the encoder-only and decoder-only
    # models, and the pluggable embeddings the tasks rely on.
    # Kept in step with src/lib/caltVersion.ts, which zip.ts rewrites at download
    # time; edit it there rather than here. Do not pin below 1.5.0, which carries
    # the embedding normalization fix.
    "calt-x==1.5.0",
    "omegaconf>=2.3.0",
    "matplotlib>=3.7.0",
    "click>=8.0.0",
]

[tool.ruff]
line-length = 100
