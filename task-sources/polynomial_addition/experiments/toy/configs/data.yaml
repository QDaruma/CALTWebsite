# polynomial_addition task (toy) — adapted from HiroshiKERA/calt-codebase examples/polynomial_addition

problem_generator:
  field: ZZ
  min_len: 3
  max_len: 6

dataset:
  save_dir: "../data"
  num_train_samples: 2000
  num_test_samples: 300
  batch_size: 1000
  n_jobs: 4
  root_seed: 42
  verbose: true
  backend: "sympy"
  save_text: true
  save_json: false
